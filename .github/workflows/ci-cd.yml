name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR with Maven (Skip Tests)
        run: ./mvnw clean package -DskipTests

      - name: Copy JAR to EC2 via SCP
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Restart Backend Service on EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Renaming JAR to standard name ---"
            mv /home/ubuntu/backend-*.jar /home/ubuntu/coachkonnects-backend.jar 2>/dev/null || true

            echo "--- Restarting the backend service ---"
            sudo systemctl restart coachkonnects

            echo "--- Waiting for service to start ---"
            sleep 5

            echo "--- Checking service status ---"
            sudo systemctl status coachkonnects --no-pager

            echo "--- Backend Deployment Complete! ---"
